name: Auto Unpack with Local V2dat

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ================= 优化：自动跟随最新的 v4 版本 =================
    - name: Checkout repository
      uses: actions/checkout@v4
    # =============================================================

    - name: Set up Environment Variables
      run: |
        echo "TAG_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download Geosite.dat
      run: |
        echo "Downloading latest geosite.dat..."
        curl -L -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

    - name: Unpack Geosite using Local V2dat
      run: |
        if [ ! -f "./v2dat" ]; then
          echo "❌ 错误：未在仓库根目录找到 v2dat 文件！"
          exit 1
        fi

        chmod +x ./v2dat

        echo "Unpacking geolocation-!cn..."
        ./v2dat unpack geosite -f 'geolocation-!cn' geosite.dat
        
        if [ -f "geosite_geolocation-!cn.txt" ]; then
          mv "geosite_geolocation-!cn.txt" geolocation-no-cn.txt
          echo "✅ 解包成功！"
        else
          echo "❌ 错误：未能生成解包文件！"
          exit 1
        fi
        
        rm -f geosite.dat
        
        # 撤销对 v2dat 的权限更改，让 Git 恢复清白
        git restore v2dat

    - name: Commit and Push txt file
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add geolocation-no-cn.txt
        
        # 检查是否真的有文件变动需要提交
        if git diff-index --quiet HEAD; then
          echo "提示：今天解包出来的文本内容与仓库里现有的完全一致，无需重复提交。"
        else
          git commit -m "自动解包更新: ${{ env.TAG_DATE }}"
          git push
        fi
