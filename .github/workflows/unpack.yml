name: Auto Unpack with Local V2dat

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Environment Variables
      run: |
        echo "TAG_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download Geosite.dat
      run: |
        echo "Downloading latest geosite.dat..."
        curl -L -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

    - name: Unpack Geosite using Local V2dat
      run: |
        # 1. 确保本地有 v2dat 文件
        if [ ! -f "./v2dat" ]; then
          echo "❌ 错误：未在仓库根目录找到 v2dat 文件，请确认是否已上传！"
          exit 1
        fi

        # 2. 赋予可执行权限
        chmod +x ./v2dat

        # 3. 执行解包（用单引号包裹防止 YAML 解析失败）
        echo "Unpacking geolocation-!cn..."
        ./v2dat unpack geosite -f 'geolocation-!cn' geosite.dat
        
        # 4. 规范命名与清理
        if [ -f "geosite_geolocation-!cn.txt" ]; then
          mv "geosite_geolocation-!cn.txt" geolocation-no-cn.txt
          echo "✅ 解包成功！"
        else
          echo "❌ 错误：未能生成解包文件！"
          exit 1
        fi
        
        rm -f geosite.dat

    - name: Commit and Push txt file
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add geolocation-no-cn.txt
        
        # 检查是否有内容变更
        if git diff-index --quiet HEAD; then
          echo "没有任何内容变更，跳过提交。"
        else
          git commit -m "自动解包更新: ${{ env.TAG_DATE }}"
          git push
        fi
